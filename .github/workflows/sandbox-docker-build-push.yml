name: Sandbox Docker Build and Push

on:
  workflow_call:
    inputs:
      source_sha:
        required: false
        type: string
      skip_preflight:
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: git.talesofai.com
  NAMESPACE: ${{ secrets.GITEA_OWNER }}
  IMAGE_NAME: cohub-sandbox

jobs:
  build-and-push:
    if: ${{ !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    outputs:
      sandbox_release_changed: ${{ steps.release-scope.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Validate service tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid production service tag: $TAG"
            echo "Expected a stable semver tag like v1.23.0."
            exit 1
          fi

      - name: Detect sandbox release changes
        id: release-scope
        run: |
          set -euo pipefail

          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="${{ github.ref_name }}"
          git fetch --tags --force --prune

          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG" | head -n 1 || true)

          if [[ -z "$PREV_TAG" ]]; then
            echo "No previous service tag found; proceeding with sandbox publish."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$PREV_TAG" "$TAG" -- apps/sandbox || true)

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No sandbox-related changes detected between $PREV_TAG and $TAG."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Sandbox-related changes detected between $PREV_TAG and $TAG:"
          echo "$CHANGED_FILES"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        if: ${{ steps.release-scope.outputs.changed == 'true' && !inputs.skip_preflight }}
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache-dependency-path: apps/sandbox/go.sum

      - name: Go fmt check
        if: ${{ steps.release-scope.outputs.changed == 'true' && !inputs.skip_preflight }}
        run: |
          cd apps/sandbox
          test -z "$(gofmt -l .)"

      - name: Go vet
        if: ${{ steps.release-scope.outputs.changed == 'true' && !inputs.skip_preflight }}
        run: |
          cd apps/sandbox
          go vet ./...

      - name: Go test
        if: ${{ steps.release-scope.outputs.changed == 'true' && !inputs.skip_preflight }}
        run: |
          cd apps/sandbox
          go test ./...

      - name: Set up Docker Buildx
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Registry
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_PAT }}

      - name: Extract metadata
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main-{{sha}},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: ./apps/sandbox
          file: ./apps/sandbox/Dockerfile
          cache-from: type=gha,scope=sandbox-build
          cache-to: type=gha,mode=min,scope=sandbox-build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

  deploy-dev:
    needs: build-and-push
    if: ${{ (inputs.skip_preflight || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config

      - name: Get short sha
        id: get-sha
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Patch sandbox image config
        run: |
          kubectl patch configmap cohub-api-dev-config -n cohub-dev --type=json \
            -p="[{\"op\":\"replace\",\"path\":\"/data/SANDBOX_IMAGE\",\"value\":\"${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:sha-${{ steps.get-sha.outputs.sha }}\"}]"

      - name: Restart API to pick up new config
        run: |
          kubectl rollout restart deployment/cohub-api-dev -n cohub-dev
          kubectl rollout status deployment/cohub-api-dev -n cohub-dev --timeout=300s

  deploy-prod:
    needs: build-and-push
    if: ${{ (inputs.skip_preflight || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v') && needs.build-and-push.outputs.sandbox_release_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config

      - name: Get tag
        id: get-tag
        run: |
          TAG="${{ github.ref_name }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Patch sandbox image config
        run: |
          kubectl patch configmap cohub-api-config -n cohub --type=json \
            -p="[{\"op\":\"replace\",\"path\":\"/data/SANDBOX_IMAGE\",\"value\":\"${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.get-tag.outputs.tag }}\"}]"

      - name: Restart API to pick up new config
        run: |
          kubectl rollout restart deployment/cohub-api -n cohub
          kubectl rollout status deployment/cohub-api -n cohub --timeout=300s
