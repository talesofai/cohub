name: API Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apps/api/**'
      - 'packages/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment for migration'
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

env:
  REGISTRY: git.talesofai.com
  NAMESPACE: ${{ secrets.GITEA_OWNER }}
  IMAGE_NAME: cohub-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @cohub/api lint

      - name: Typecheck
        run: pnpm --filter @cohub/api typecheck

      - name: Build (api)
        run: pnpm --filter @cohub/api build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-{{sha}}
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          cache-from: type=gha,scope=api-build
          cache-to: type=gha,mode=min,scope=api-build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

  deploy-dev:
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config

      - name: Run migration if needed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- \
            'apps/api/src/db/schema.ts' \
            'apps/api/drizzle/*.sql' 2>/dev/null || true)
          
          if [ -z "$CHANGED" ]; then
            echo "No migration needed"
            exit 0
          fi
          
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}
          echo "Migration needed, running with image: $IMAGE"
          
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: api-migrate-${{ github.run_id }}
            namespace: cohub-dev
          spec:
            activeDeadlineSeconds: 180
            ttlSecondsAfterFinished: 300
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${IMAGE}
                    imagePullPolicy: Always
                    command: ["node", "dist/db/migrate.js"]
                    env:
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef:
                            name: cohub-api-dev-secrets
                            key: DATABASE_URL
          EOF
          
          if kubectl wait --for=condition=complete job/api-migrate-${{ github.run_id }} \
            -n cohub-dev --timeout=300s; then
            echo "Migration completed successfully"
          else
            echo "Migration job failed or timed out, showing diagnostics:"
            echo "--- Pod Events ---"
            kubectl describe job api-migrate-${{ github.run_id }} -n cohub-dev || true
            echo "--- Pod Logs ---"
            kubectl logs job/api-migrate-${{ github.run_id }} -n cohub-dev --tail=50 || true
            echo "--- Pod Status ---"
            kubectl get pods -n cohub-dev -l job-name=api-migrate-${{ github.run_id }} || true
            exit 1
          fi

      - name: Deploy to Dev
        run: |
          kubectl rollout restart deployment/cohub-api-dev -n cohub-dev

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/cohub-api-dev -n cohub-dev --timeout=300s

  deploy-prod:
    needs: build-and-push
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config

      - name: Get release tag
        id: get-tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Run migration
        env:
          TAG: ${{ steps.get-tag.outputs.tag }}
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          echo "Running migration with image: $IMAGE"
          
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: api-migrate-${{ github.run_id }}
            namespace: cohub
          spec:
            activeDeadlineSeconds: 180
            ttlSecondsAfterFinished: 300
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${IMAGE}
                    imagePullPolicy: Always
                    command: ["node", "dist/db/migrate.js"]
                    env:
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef:
                            name: cohub-api-secrets
                            key: DATABASE_URL
          EOF
          
          if kubectl wait --for=condition=complete job/api-migrate-${{ github.run_id }} \
            -n cohub --timeout=300s; then
            echo "Migration completed successfully"
          else
            echo "Migration job failed or timed out, showing diagnostics:"
            echo "--- Pod Events ---"
            kubectl describe job api-migrate-${{ github.run_id }} -n cohub || true
            echo "--- Pod Logs ---"
            kubectl logs job/api-migrate-${{ github.run_id }} -n cohub --tail=50 || true
            echo "--- Pod Status ---"
            kubectl get pods -n cohub -l job-name=api-migrate-${{ github.run_id }} || true
            exit 1
          fi

      - name: Deploy to Prod
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          kubectl set image deployment/cohub-api cohub-api=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:$TAG -n cohub
          kubectl patch configmap cohub-api-config -n cohub --type=json -p="[{\"op\":\"replace\",\"path\":\"/data/SANDBOX_AGENT_IMAGE\",\"value\":\"${{ env.REGISTRY }}/${{ env.NAMESPACE }}/cohub-agent:$TAG\"}]"

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/cohub-api -n cohub --timeout=300s

  # Manual migration trigger for dev/prod
  migrate-dev:
    needs: build-and-push
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config

      - name: Run migration
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}
          echo "Running migration with image: $IMAGE"

          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: api-migrate-${{ github.run_id }}
            namespace: cohub-dev
          spec:
            activeDeadlineSeconds: 180
            ttlSecondsAfterFinished: 300
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${IMAGE}
                    imagePullPolicy: Always
                    command: ["node", "dist/db/migrate.js"]
                    env:
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef:
                            name: cohub-api-dev-secrets
                            key: DATABASE_URL
          EOF

          if kubectl wait --for=condition=complete job/api-migrate-${{ github.run_id }} \
            -n cohub-dev --timeout=300s; then
            echo "Migration completed successfully"
          else
            echo "Migration job failed or timed out, showing diagnostics:"
            echo "--- Pod Events ---"
            kubectl describe job api-migrate-${{ github.run_id }} -n cohub-dev || true
            echo "--- Pod Logs ---"
            kubectl logs job/api-migrate-${{ github.run_id }} -n cohub-dev --tail=50 || true
            echo "--- Pod Status ---"
            kubectl get pods -n cohub-dev -l job-name=api-migrate-${{ github.run_id }} || true
            exit 1
          fi

  migrate-prod:
    needs: build-and-push
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config

      - name: Run migration
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}
          echo "Running migration with image: $IMAGE"

          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: api-migrate-${{ github.run_id }}
            namespace: cohub
          spec:
            activeDeadlineSeconds: 180
            ttlSecondsAfterFinished: 300
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${IMAGE}
                    imagePullPolicy: Always
                    command: ["node", "dist/db/migrate.js"]
                    env:
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef:
                            name: cohub-api-secrets
                            key: DATABASE_URL
          EOF

          if kubectl wait --for=condition=complete job/api-migrate-${{ github.run_id }} \
            -n cohub --timeout=300s; then
            echo "Migration completed successfully"
          else
            echo "Migration job failed or timed out, showing diagnostics:"
            echo "--- Pod Events ---"
            kubectl describe job api-migrate-${{ github.run_id }} -n cohub || true
            echo "--- Pod Logs ---"
            kubectl logs job/api-migrate-${{ github.run_id }} -n cohub --tail=50 || true
            echo "--- Pod Status ---"
            kubectl get pods -n cohub -l job-name=api-migrate-${{ github.run_id }} || true
            exit 1
          fi
