name: Web Deploy to Cloudflare Workers

on:
  workflow_call:
    inputs:
      source_sha:
        required: false
        type: string
      skip_preflight:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      GITEA_NPM_TOKEN: ${{ secrets.GITEA_NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Configure Talesofai npm auth
        run: |
          if [ -z "$GITEA_NPM_TOKEN" ]; then
            echo "GITEA_NPM_TOKEN not set; installing without private billing packages"
          fi
          if [ -n "$GITEA_NPM_TOKEN" ]; then
            printf '\n//git.talesofai.com/api/packages/talesofai/npm/:_authToken=%s\n' "$GITEA_NPM_TOKEN" >> ~/.npmrc
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine environment
        id: env
        run: |
          # Tag 触发 → prod（仅服务 tag，如 v1.23.0）
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid production service tag: $TAG"
              echo "Expected a stable semver tag like v1.23.0."
              exit 1
            fi
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "config=wrangler.prod.toml" >> $GITHUB_OUTPUT
          # 手动触发 → 根据用户选择
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "config=wrangler.prod.toml" >> $GITHUB_OUTPUT
          # Push main → dev
          else
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "config=wrangler.toml" >> $GITHUB_OUTPUT
          fi

      - name: Setup web environment
        working-directory: apps/web
        run: |
          echo "PUBLIC_COHUB_ENV=${{ steps.env.outputs.env }}" > .env
          if [[ "${{ steps.env.outputs.env }}" == "prod" ]]; then
            echo "PUBLIC_API_ORIGIN=https://api.cohub.live" >> .env
            echo "PUBLIC_GATEWAY_ORIGIN=https://gateway.cohub.live" >> .env
            echo "PUBLIC_PREVIEW_ORIGIN=https://preview.cohub.live" >> .env
            echo "PUBLIC_LOGTO_ENDPOINT=https://auth.neta.art/" >> .env
            echo "PUBLIC_LOGTO_APP_ID=16ai0wao2mud3xqkbzqo0" >> .env
            echo "PUBLIC_LOGTO_API_RESOURCE=https://api.talesofai" >> .env
          else
            echo "PUBLIC_API_ORIGIN=https://api-dev.cohub.live" >> .env
            echo "PUBLIC_GATEWAY_ORIGIN=https://gateway-dev.cohub.live" >> .env
            echo "PUBLIC_PREVIEW_ORIGIN=https://preview-dev.cohub.live" >> .env
            echo "PUBLIC_LOGTO_ENDPOINT=https://dev-auth.neta.art/" >> .env
            echo "PUBLIC_LOGTO_APP_ID=vpikk7sl9zwvefiptowtn" >> .env
            echo "PUBLIC_LOGTO_API_RESOURCE=https://api.talesofai" >> .env
          fi

      - name: Lint
        if: ${{ !inputs.skip_preflight }}
        run: pnpm lint
        working-directory: apps/web

      - name: Typecheck
        if: ${{ !inputs.skip_preflight }}
        run: pnpm typecheck
        working-directory: apps/web

      - name: Build
        run: pnpm build
        working-directory: apps/web

      - name: Deploy to Cloudflare
        run: pnpm run deploy --config ${{ steps.env.outputs.config }}
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
