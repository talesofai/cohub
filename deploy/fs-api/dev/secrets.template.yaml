# FS-API Dev 敏感配置模板
# 注意：请勿提交真实 secrets.yaml 到仓库
# 从 api dev secrets 复制相同值（DATABASE_URL / REDIS_URL / BULLMQ_REDIS_URL /
# APP_ENCRYPTION_KEY / WORKER_SECRET / TURN_OBJECT_S3_* 必须与 api dev 一致）

apiVersion: v1
kind: Secret
metadata:
  name: cohub-fs-api-dev-secrets
  namespace: cohub-dev
stringData:
  DATABASE_URL: "postgres://user:pass@host:5432/cohub"
  REDIS_URL: "redis://redis-service:6379"
  BULLMQ_REDIS_URL: "redis://redis-bullmq-service:6379"
  APP_ENCRYPTION_KEY: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET"
  WORKER_SECRET: "CHANGE_ME"
  TURN_OBJECT_S3_ACCESS_KEY_ID: "CHANGE_ME"
  TURN_OBJECT_S3_SECRET_ACCESS_KEY: "CHANGE_ME"
