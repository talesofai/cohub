# 请填写后再部署
# 如需重新生成可参考 values.template.yaml

# ========== 基础 ==========
NAMESPACE: "cohub"
APP_NAME: "cohub-api"

# ========== 镜像 ==========
IMAGE_REPOSITORY: "git.talesofai.com/talesofai/cohub-api"
IMAGE_TAG: "latest"
IMAGE_PULL_POLICY: "IfNotPresent"
IMAGE_PULL_SECRET: "gitea-registry"

# ========== 服务端口 ==========
SERVICE_PORT: "8787"
CONTAINER_PORT: "8787"

# ========== 副本与资源 ==========
REPLICAS: "1"
REQUEST_CPU: "200m"
REQUEST_MEMORY: "256Mi"
LIMIT_CPU: "500m"
LIMIT_MEMORY: "512Mi"

# ========== 健康检查 ==========
LIVENESS_PATH: "/healthz"
LIVENESS_INITIAL_DELAY: "20"
LIVENESS_PERIOD: "10"
LIVENESS_TIMEOUT: "2"
LIVENESS_FAILURE_THRESHOLD: "3"
READINESS_PATH: "/readyz"
READINESS_INITIAL_DELAY: "5"
READINESS_PERIOD: "5"
READINESS_TIMEOUT: "2"
READINESS_FAILURE_THRESHOLD: "3"

# ========== API 配置 ==========
AUTH_BASE_URL: "https://api.talesofai.com"
GITEA_BASE_URL: "https://gitea.cohub.run/"
GITEA_MANAGED_EMAIL_DOMAIN: "cohub.run"
WEB_ORIGIN: "https://cohub.run"
SANDBOX_AGENT_IMAGE: "git.talesofai.com/talesofai/cohub-agent:latest"
SPACE_STORAGE_ROOT: "/mnt/cohub-space-storage"
SPACE_STORAGE_PVC: "cohub-sessions-pvc"

# ========== 路由配置 ==========
ROUTE_ENABLED: "true"
API_HOSTNAME: "api.cohub.run"

# ========== 环境标识 ==========
ENV: "prod"
