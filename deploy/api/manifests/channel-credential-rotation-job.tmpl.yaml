apiVersion: batch/v1
kind: Job
metadata:
  name: __APP_NAME__-channel-credential-rotation
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: __APP_NAME__-channel-credential-rotation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: __APP_NAME__-channel-credential-rotation
    spec:
      restartPolicy: Never
__IMAGE_PULL_SECRETS_BLOCK__
      containers:
        - name: rotate-channel-credentials
          image: __IMAGE_REPOSITORY__:__IMAGE_TAG__
          imagePullPolicy: __IMAGE_PULL_POLICY__
          command: ["node", "dist/db/rotate-channel-credentials.js"]
__ARGS_BLOCK__
          envFrom:
            - secretRef:
                name: __APP_NAME__-secrets
            - secretRef:
                name: __APP_NAME__-private-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
