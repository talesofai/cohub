apiVersion: v1
kind: ConfigMap
metadata:
  name: {{APP_NAME}}-config
  namespace: {{NAMESPACE}}
data:
  ENV: "{{ENV}}"
  LOG_LEVEL: "{{LOG_LEVEL}}"
  NODE_OPTIONS: "--max-old-space-size=1536"
  WORKSPACE_ROOT: "{{WORKSPACE_ROOT}}"
  CHECKPOINT_CACHE_ROOT: "{{CHECKPOINT_CACHE_ROOT}}"
  SESSIONS_DIR: "{{SESSIONS_DIR}}"
  SESSIONS_NAMESPACE: "{{SESSIONS_NAMESPACE}}"
  PLATFORM_CONFIG_ROOT: "{{PLATFORM_CONFIG_ROOT}}"
  AGENT_WORKER_CONCURRENCY: "{{AGENT_WORKER_CONCURRENCY}}"
  AGENT_LOCK_DB_POOL_MAX: "{{AGENT_LOCK_DB_POOL_MAX}}"
  AGENT_SHUTDOWN_DRAIN_TIMEOUT_MS: "{{AGENT_SHUTDOWN_DRAIN_TIMEOUT_MS}}"
  NATIVE_AGENT_MIRROR_ENABLED: "{{NATIVE_AGENT_MIRROR_ENABLED}}"
  TURN_OBJECT_S3_ENDPOINT: "{{TURN_OBJECT_S3_ENDPOINT}}"
  TURN_OBJECT_S3_REGION: "{{TURN_OBJECT_S3_REGION}}"
  TURN_OBJECT_S3_BUCKET: "{{TURN_OBJECT_S3_BUCKET}}"
  TURN_OBJECT_S3_TIMEOUT_MS: "{{TURN_OBJECT_S3_TIMEOUT_MS}}"
  TURN_OBJECT_S3_MAX_ATTEMPTS: "{{TURN_OBJECT_S3_MAX_ATTEMPTS}}"
  TURN_OBJECT_CDN_BASE_URL: "{{TURN_OBJECT_CDN_BASE_URL}}"
  PUBLIC_ASSET_CDN_BASE_URL: "{{PUBLIC_ASSET_CDN_BASE_URL}}"
  CHAT_ATTACHMENT_PUBLIC_BASE_URL: "{{CHAT_ATTACHMENT_PUBLIC_BASE_URL}}"
  USER_UPLOAD_S3_ENDPOINT: "{{USER_UPLOAD_S3_ENDPOINT}}"
  USER_UPLOAD_S3_REGION: "{{USER_UPLOAD_S3_REGION}}"
  SPACE_UPLOAD_S3_BUCKET: "{{SPACE_UPLOAD_S3_BUCKET}}"
  WORKSPACE_OBJECT_ENDPOINT: "{{WORKSPACE_OBJECT_ENDPOINT}}"
  WORKSPACE_OBJECT_REGION: "{{WORKSPACE_OBJECT_REGION}}"
  WORKSPACE_OBJECT_BUCKET: "{{WORKSPACE_OBJECT_BUCKET}}"
  PUBLIC_ASSET_DOWNLOAD_TIMEOUT_MS: "{{PUBLIC_ASSET_DOWNLOAD_TIMEOUT_MS}}"
