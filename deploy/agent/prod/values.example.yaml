# Example deploy values. Copy to values.yaml and fill in your environment.
# Real environment values are not committed (see .gitignore).

appName: cohub-agent
namespace: cohub
serviceName: cohub-agent
port: 8788
image: ghcr.io/example/cohub-agent:v1.43.0
replicas: "4"
maxUnavailable: "0"
maxSurge: "1"
terminationGracePeriodSeconds: "86400"
imagePullPolicy: IfNotPresent
env: prod
logLevel: info
workerSecret: ""
workspaceRoot: /space-storage
checkpointCacheRoot: /checkpoint-cache
sessionsDir: /sessions
platformConfigRoot: /configs
spaceStoragePvc: cohub-spaces-pvc
checkpointCachePvc: cohub-checkpoints-pvc
workspaceSubpath: workspaces/prod
checkpointCacheSubpath: workspaces/prod/checkpoints
sessionsSubpath: sessions/prod
configsSubpath: configs/prod
sessionsNamespace: cohub-sessions
agentWorkerConcurrency: "8"
agentLockDbPoolMax: "18"
agentShutdownDrainTimeoutMs: "86400000"
nativeAgentMirrorEnabled: "false"
resourceRequestCpu: "0.5"
resourceRequestMemory: "512Mi"
resourceLimitCpu: "2"
resourceLimitMemory: "2Gi"
TURN_OBJECT_S3_ENDPOINT: "https://s3.example.com"
TURN_OBJECT_S3_REGION: "us-east-1"
TURN_OBJECT_S3_BUCKET: "cohub-sessions"
TURN_OBJECT_S3_TIMEOUT_MS: "5000"
TURN_OBJECT_S3_MAX_ATTEMPTS: "3"
TURN_OBJECT_CDN_BASE_URL: "https://sessions.example.com"
PUBLIC_ASSET_CDN_BASE_URL: "https://public.example.com"
CHAT_ATTACHMENT_PUBLIC_BASE_URL: "https://uploads.example.com"
USER_UPLOAD_S3_ENDPOINT: "https://account-id.r2.cloudflarestorage.com"
USER_UPLOAD_S3_REGION: "auto"
SPACE_UPLOAD_S3_BUCKET: "cohub-space-uploads"
WORKSPACE_OBJECT_ENDPOINT: "https://account-id.r2.cloudflarestorage.com"
WORKSPACE_OBJECT_REGION: "auto"
WORKSPACE_OBJECT_BUCKET: "cohub-space-uploads"
PUBLIC_ASSET_DOWNLOAD_TIMEOUT_MS: "5000"
