# Prod 环境敏感配置
# 注意：请勿提交真实 secrets 到仓库
# 复制此文件为 secrets.yaml 并填入真实值

apiVersion: v1
kind: Secret
metadata:
  name: cohub-gateway-secrets
  namespace: cohub
stringData:
  # Redis 连接地址
  REDIS_URL: "redis://..."
  # Must match cohub-api-secrets.WORKER_SECRET
  WORKER_SECRET: "..."
  # Must match cohub-api-private-secrets.GATEWAY_INTERNAL_SECRET.
  GATEWAY_INTERNAL_SECRET: "..."
