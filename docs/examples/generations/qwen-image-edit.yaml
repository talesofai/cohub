schema: neta.generation.model.v1
model: qwen-image-edit
title: Qwen Image Edit
description: Neta Qwen image editing with one source image and an edit instruction.
adapter:
  type: openai.imageEdits
content:
  input:
    - type: text
      required: true
      min: 1
      max: 16
      merge: newline
      description: Edit instruction.
    - type: image
      required: true
      min: 1
      max: 1
      sources:
        - url
      description: Source image URL to edit.
parameters:
  size:
    type: string
    optional: true
    default: 1024x1024
    description: Output image size.
    examples:
      - 1024x1024
      - 768x1024
      - 1024x768
examples:
  - title: Edit image
    request:
      model: qwen-image-edit
      content:
        - type: text
          text: change the background to a clean white studio backdrop
        - type: image
          source:
            type: url
            url: https://example.com/input.png
      parameters:
        size: 1024x1024
